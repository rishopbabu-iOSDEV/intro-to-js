    <link rel="stylesheet" href="styles.css">

<body>
    <button id="navToggle" aria-label="Toggle navigation menu">☰</button>
    <button id="darkAndLight" aria-label="Toggle light and dark mode">🌓</button>
    <nav class="siteNav">
        <a href="" target="_blank">Home</a>
        <a href="" target="_blank">About</a>
        <a href="" target="_blank">Projects</a>
        <a href="" target="_blank">Contact</a>
    </nav>
    <h1 id="title">College Website</h1>
    <p class="message">Welcome, students!</p>
    <p class="message">Welcome, students!</p>
    <p class="message">Welcome, students!</p>
    <p id="announcement"></p>
    <p id="greeting"></p>
    <br>

    <a id="myLink" href="https://example.com" target="_blank">visit this website</a>
    <br>
    <br>
    <h2 id="result"> Exam Results </h2>

    <div id="box"></div>

    <label for="message">Message</label>
    <textarea id="message1" maxlength="200"></textarea>
    <p id="charCount">0 / 200</p>

    <ul id="snackList"></ul>


    <section class="projects-section">
        <h2>My Projects</h2>
        <div id="filterButton"></div>
        <div id="projectGrid"></div>
    </section>

    <form id="contact-form" novalidate>
        <div class="field">
            <label for="name">Name</label>
            <input type="text" id="name" name="name">
            <span class="error-message" id="name-error">Please enter your name.</span>
        </div>

        <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email">
            <span class="error-message" id="email-error">Please enter a valid email.</span>
        </div>

        <div class="field">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="4"></textarea>
            <span class="error-message" id="message-error">Please enter a message.</span>
        </div>

        <button type="submit">Send Message</button>
        <p id="form-success" class="success-message"></p>
    </form>



    <footer>
        &copy; <span id="year">2022</span> My Portfolio
    </footer>
